name: mirror
description: "Mirror — Open-source Android screen mirroring and remote control for Windows by Dev Fahim"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  window_manager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo.jpg
    - assets/bin/mirror-server.jar
    - assets/bin/adb/adb.exe
    - assets/bin/adb/AdbWinApi.dll
    - assets/bin/adb/AdbWinUsbApi.dll
    - assets/bin/adb/libwinpthread-1.dll
